name: Code Testing

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lintandTesting:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24, 25]
        name: lint & test w/ node v${{ matrix.node }}
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}

            - run: npm ci --no-workspaces
            - run: npm run lint
            - name: Validate conversion maps (requires ampscript-data and ssjs-data sibling repos)
              run: node scripts/validate-conversion-maps.mjs
              working-directory: ..
              continue-on-error: true
            - run: npm test
